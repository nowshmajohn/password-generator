# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow installs Deno, runs lint, and generates SLSA provenance
name: Deno

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Deno
        uses: denoland/setup-deno@137d9d3d4b7c7a7d1c2d3e4f5a6b7c8d9e0f1a2b # v2.0.1
        with:
          deno-version: v2.0.2
      
      - name: Lint
        run: deno lint
