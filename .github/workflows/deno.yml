# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow installs Deno, runs lint, and generates SLSA provenance
name: Deno

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write  # needed for SLSA
  attestations: write  # needed for SLSA

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@3d3c42e9f1a5d9a2b3c4d5e6f7a8b9c0d1e2f3a # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@91b1a6b2c5d9e5f1a2b3c4d5e6f7a8b9c0d1e2f # v2.0.3
        with:
          deno-version: v1.x

      - name: Lint
        run: deno lint

      - name: Format check
        run: deno fmt --check
