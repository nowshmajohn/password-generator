# separate terms of service, privacy policy, and support
# documentation.

# This workflow installs Deno, runs lint, and generates SLSA provenance
name: Deno

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write  # needed for SLSA
  attestations: write  # needed for SLSA

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Lint
        run: deno lint

      - name: Format check
        run: deno fmt --check
