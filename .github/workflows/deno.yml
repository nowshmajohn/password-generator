# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow installs Deno, runs lint, and generates SLSA provenance
name: Deno

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Deno
        uses: denoland/setup-deno@2c1f3c3d7b1a2c3d4e5f6a7b8c9d0e1f2a3b4c5d
        with:
          deno-version: v2.0.2
      
      - name: Lint
        run: deno lint
